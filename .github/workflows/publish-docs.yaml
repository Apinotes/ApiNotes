# .github/workflows/publish-docs.yml
name: Publish API Docs
on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: apinotes/validate-action@v1
        with:
          api-key: ${{ secrets.APINOTES_API_KEY }}
          spec-path: openapi-full-example-v2.5.1.json          # path to your spec in the repo
          project-id: 6a9ebeb970b6b2e5937e40cf